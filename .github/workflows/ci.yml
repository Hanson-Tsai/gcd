name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # gcd sets its own author and disables line-ending conversion per
      # git-dir; these global settings only guard the checkout and any test
      # helper that shells out to git.
      - name: Configure git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global user.name "gcd-ci"
          git config --global user.email "gcd-ci@example.invalid"
          git config --global init.defaultBranch main
          git --version

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
