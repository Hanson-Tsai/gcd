schema_version: "1.1"
name: init-github-no-token
expected_outcome: |
  The agent checks gcd, explains the fine-grained token with Contents,
  Workflows and Actions read and write for alice/notes, and gives the line
  `gcd init alice/notes ~/Notes` for the user's own terminal. It does not run
  gcd init for the GitHub repo and never asks for the token in the chat.
context:
  scaffold_script: setup.sh
